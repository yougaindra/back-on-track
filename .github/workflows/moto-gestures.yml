name: Moto Gestures CI

on:
  push:
    paths:
      - 'apps/moto-gestures/**'
      - '.github/workflows/moto-gestures.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'apps/moto-gestures/**'
      - '.github/workflows/moto-gestures.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Moto Gestures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Run Unit Tests
        run: ./gradlew :apps:moto-gestures:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :apps:moto-gestures:assembleDebug --no-daemon --stacktrace

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-gestures-debug-apk
          path: apps/moto-gestures/build/outputs/apk/debug/*.apk
